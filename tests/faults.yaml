# Historical faults, each as a mutation that must break a named assertion.
#
# Every one of these shipped. Most were false negatives -- a predicate too
# restrictive, a family unregistered, a producer retired too early -- and the
# guard-neutralisation discipline used elsewhere does not reach them: it makes
# predicates more permissive, which exercises false positives only.
#
# `kills` names the assertion that must fail. Requiring a specific one, rather
# than "something fails", is what stops a test from passing for a reason
# unrelated to the fault it is credited with catching.

faults:
  - name: region-equality-rejects-nesting
    issue: 60
    why: >-
      control_region equality rejected a producer and consumer in nested
      regions along with genuinely exclusive arms. Six real VVenC findings
      went unreported.
    file: src/simde_lint/rules/base.py
    indent: 4
    find: |
      mine = dict(one.selection_arms)
      for selection, arm in other.selection_arms:
          if selection in mine and mine[selection] != arm:
              return False
      return True
    replace: |
      return one.control_region == other.control_region
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[nested_regions.c]"

  - name: prefix-of-rejects-sequential-siblings
    issue: 65
    why: >-
      The replacement for equality asked whether one region chain was a prefix
      of the other. That admits nesting and still rejects two sibling blocks,
      which run one after the other.
    file: src/simde_lint/rules/base.py
    indent: 4
    find: |
      mine = dict(one.selection_arms)
      for selection, arm in other.selection_arms:
          if selection in mine and mine[selection] != arm:
              return False
      return True
    replace: |
      a, b = one.region_chain, other.region_chain
      shorter, longer = (a, b) if len(a) <= len(b) else (b, a)
      return longer[: len(shorter)] == shorter
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[nested_regions.c]"

  - name: widening-retires-producer-after-first-consumer
    issue: 66
    why: >-
      Rule W stopped at one unpack per multiply pair, so a pair rebuilding all
      eight lanes reported once where its own docstring and its cost model say
      twice.
    file: src/simde_lint/rules/widening.py
    find: "                matched = True\n"
    replace: "                matched = True\n                yield self._finding(unit, cost, lo, hi, consumer)\n                break\n"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[shared_producers.c]"

  - name: fusion-stops-at-the-first-add
