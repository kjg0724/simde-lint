# Historical faults, each as a mutation that must break a named assertion.
#
# Every one of these shipped. Most were false negatives -- a predicate too
# restrictive, a family unregistered, a producer retired too early -- and the
# guard-neutralisation discipline used elsewhere does not reach them: it makes
# predicates more permissive, which exercises false positives only.
#
# `kills` names the assertion that must fail. Requiring a specific one, rather
# than "something fails", is what stops a test from passing for a reason
# unrelated to the fault it is credited with catching.

faults:
  - name: region-equality-rejects-nesting
    issue: 60
    why: >-
      control_region equality rejected a producer and consumer in nested
      regions along with genuinely exclusive arms. Six real VVenC findings
      went unreported.
    file: src/simde_lint/rules/base.py
    indent: 4
    find: |
      mine = dict(one.selection_arms)
      for selection, arm in other.selection_arms:
          if selection in mine and mine[selection] != arm:
              return False
      return True
    replace: |
      return one.control_region == other.control_region
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[nested_regions.c]"

  - name: prefix-of-rejects-sequential-siblings
    issue: 65
    why: >-
      The replacement for equality asked whether one region chain was a prefix
      of the other. That admits nesting and still rejects two sibling blocks,
      which run one after the other.
    file: src/simde_lint/rules/base.py
    indent: 4
    find: |
      mine = dict(one.selection_arms)
      for selection, arm in other.selection_arms:
          if selection in mine and mine[selection] != arm:
              return False
      return True
    replace: |
      a, b = one.region_chain, other.region_chain
      shorter, longer = (a, b) if len(a) <= len(b) else (b, a)
      return longer[: len(shorter)] == shorter
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[nested_regions.c]"

  - name: widening-retires-producer-after-first-consumer
    issue: 66
    why: >-
      Rule W stopped at one unpack per multiply pair, so a pair rebuilding all
      eight lanes reported once where its own docstring and its cost model say
      twice.
    file: src/simde_lint/rules/widening.py
    find: "                matched = True\n"
    replace: "                matched = True\n                yield self._finding(unit, cost, lo, hi, consumer)\n                break\n"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[shared_producers.c]"

  - name: fusion-stops-at-the-first-add
    issue: 68
    why: >-
      Rule F reported one finding per multiply. An add is one opportunity, so
      a product reaching two adds is two.
    file: src/simde_lint/rules/fusion.py
    find: "                    raw_name=raw_name_if_aliased(mul),\n                )\n"
    replace: "                    raw_name=raw_name_if_aliased(mul),\n                )\n                break\n"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[shared_producers.c]"

  - name: sixteen-lane-family-unregistered
    issue: null
    why: >-
      _ADD_LANES carried no 16-lane add, so vmlaq_s16 could never be printed
      and SVT-AV1's CDEF filters reported nothing at all.
    file: src/simde_lint/rules/fusion.py
    find: "    \"_mm_add_epi16\": (\"i\", 16),\n    \"_mm256_add_epi16\": (\"i\", 16),\n"
    replace: ""
    kills: "tests/test_rule_fusion.py::test_a_sixteen_lane_accumulator_names_its_fused_form"

  - name: fusion-requires-a-named-product
    issue: 42
    why: >-
      Rule F gated on mul.result_var, so the idiomatic nested spelling was
      invisible. The independent checker shared the blind spot.
    file: src/simde_lint/rules/fusion.py
    find: "        if _operand_hop(unit, add, mul) is not _NOT_AN_OPERAND:\n            return True\n"
    replace: ""
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[fusion_shapes.c]"

  - name: width-check-ignores-element-kind
    issue: null
    why: >-
      Comparing lane width alone let an integer product reaching _mm_add_ps
      grade A, naming an integer multiply-accumulate for a float accumulator.
    file: src/simde_lint/rules/fusion.py
    find: "        if kind == _ELEMENT_KIND[cost.key] and wanted == actual:\n"
    replace: "        if wanted == actual:\n"
    kills: "tests/test_rule_fusion.py::test_an_integer_product_reaching_a_float_add_is_not_named"

  - name: portable-fallback-asserts-emitted-instructions
    issue: 63
    why: >-
      A rationale claimed which machine instructions SIMDe emits for an
      expansion that has no NEON branch and leaves the count to the compiler.
    file: src/simde_lint/rules/fusion.py
    find: "    if cost.portable_fallback:\n"
    replace: "    if False:\n"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[portable_fallback.c]"

  - name: withdrawn-suggestion-keeps-its-instruction-count
    issue: null
    why: >-
      A width-mismatched finding dropped its suggestion and kept native_insns,
      so the report said "no suggestion offered (4 -> 3 instructions)".
    file: src/simde_lint/rules/fusion.py
    find: "                    native_insns = None\n"
    replace: ""
    kills: "tests/test_rule_fusion.py::test_a_withdrawn_suggestion_takes_its_instruction_count_with_it"

  - name: widening-filters-the-consumer-after-choosing-it
    issue: 62
    why: >-
      The region test ran on the chosen candidate, so the search ended at one
      the rule then rejected and a later valid unpack was never reached.
    file: src/simde_lint/rules/widening.py
    find: "            if not on_a_common_path(lo, unpack):\n"
    replace: "            if False:\n"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[consumer_choice.c]"

  - name: widening-reports-an-unrecognized-intrinsic
    issue: null
    why: >-
      Rule W writes its reported name as a literal rather than reporting a
      matched anchor, so a typo in it would put a spelling no knowledge table
      carries into every W finding. The assertion that claimed to catch this
      checked the literal written in the test file instead of the one the rule
      emits, and stayed green through exactly this mutation.
    file: src/simde_lint/rules/widening.py
    find: "_REPORTED = \"_mm_mullo_epi16\""
    replace: "_REPORTED = \"_mm_NOT_A_REAL_INTRINSIC\""
    kills: "tests/test_verification.py::test_no_rule_can_report_an_intrinsic_the_knowledge_tables_do_not_recognize"

  - name: widening-matches-the-unpack-by-membership
    issue: null
    why: >-
      The consumer was chosen with `{arg.text for arg in unpack.args}`, a set,
      so the halves could arrive in either order. Reversed they rebuild
      nothing: 0x00060000 against the instruction's 0x00000006, compiled and
      run against SIMDe 0.8.4.
    file: src/simde_lint/rules/widening.py
    find: "            if len(texts) == 2 and texts[0] == lo_var and texts[1] == hi_var:"
    replace: "            if lo_var in texts and hi_var in texts:"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[widening_value_identity.c]"

  - name: widening-reads-a-macro-resolved-consumer
    issue: null
    why: >-
      `docs/mechanisms.md` states that a macro-resolved consumer is abstained
      from, because its recorded arguments are the call site's own with no
      mapping through the body. W did not do it, so `#define REV(x, y)
      _mm_unpacklo_epi16((y), (x))` invoked as `REV(lo, hi)` passed an
      ordering check while the body reversed the halves.
    file: src/simde_lint/rules/widening.py
    find: "            if unpack.is_macro_alias:"
    replace: "            if False:"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[widening_value_identity.c]"

  - name: widening-compares-operand-spelling-not-value
    issue: null
    why: >-
      `_operand_key` compares the operands' text, so an input rebound between
      the two multiplies left the pair looking shared. The halves then belong
      to different products: the source gives 65542 where the instruction
      gives 6 or 98301 depending on which inputs it reads.
    file: src/simde_lint/rules/widening.py
    find: "                    stable=_operands_stable_between(unit, lo, hi),"
    replace: "                    stable=True,"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[widening_value_identity.c]"

  - name: widening-reads-a-producer-that-may-not-have-run
    issue: null
    why: >-
      `on_a_common_path` answers whether two calls can both run, which is not
      whether the earlier one necessarily ran. A multiply inside `if (flag)`
      with its unpack after the `if` passed it, and on the flag-false pass the
      unpack consumes whatever the name held: source 1000 where the proposed
      instruction gives 6. A `for` whose count is zero behaves identically,
      which is what closed `control.loop_boundary`.
    file: src/simde_lint/rules/widening.py
    find: "                        reaches_on_every_path(lo, consumer)"
    replace: "                        True or reaches_on_every_path(lo, consumer)"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[consumer_choice.c]"

  - name: fusion-reads-a-producer-that-may-not-have-run
    issue: null
    why: >-
      The same relation for rule F. `nested_regions.c` keeps its verdict that
      both nesting directions are instances; what does not follow is the
      grade. A fused instruction placed at the add runs on the passes that
      skipped the multiply too.
    file: src/simde_lint/rules/fusion.py
    find: "                if not reaches_on_every_path(mul, add):"
    replace: "                if False:"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[nested_regions.c]"

  - name: mask-initializer-taken-for-a-writable-array
    issue: null
    why: >-
      The symbol index registered any array with an initializer, so
      `unsigned char mask[16] = {0}` followed by `mask[0] = 16` graded A with
      the guard dropped. Writes are not tracked, so `const` is the only claim
      available. Measured: pshufb returns the source byte at lane 0 where
      unguarded tbl returns zero.
    file: src/simde_lint/symbols.py
    find: "        if not _is_const(decl, source) or not _byte_sized(decl, source):"
    replace: "        if False:"
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[mask_is_not_its_initializer.c]"

  - name: mask-table-inside-arithmetic-resolves-to-the-table
    issue: null
    why: >-
      Operands were called a symbol load whenever their text contained `[` or
      `*`, which `bias ^ *(__m128i *)mask` satisfies as readily as the load
      does. The rule then graded the whole expression on the table's lanes
      while the XOR put every index out of range.
    file: src/simde_lint/extract.py
    find: "    if symbol and _is_a_plain_load(node):"
    replace: '    if symbol and ("[" in text or "*" in text):'
    kills: "tests/test_oracle.py::test_the_tool_agrees_with_the_hand_decided_expectation[mask_is_not_its_initializer.c]"

