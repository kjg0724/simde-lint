[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simde-lint"
version = "2.4.0"
description = "Detect SIMDe emulation inefficiencies in x86 intrinsic code ported to ARM NEON"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-cpp>=0.23",
    "PyYAML>=6.0",
]

[project.scripts]
simde-lint = "simde_lint.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/simde_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Superseded verification scripts, kept for provenance rather than for use.
extend-exclude = ["docs/precision/superseded"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Line length is deliberately not enforced. The comments in this codebase carry
# the reasoning behind each rule, and reflowing 258 prose lines would be churn
# with no defect behind it. What is selected is the defect classes the absence
# of a linter was actually costing: unused names, ambiguous names, unsorted
# imports.
ignore = ["E501"]
