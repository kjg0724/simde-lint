# Alternate spellings that normalize to a canonical x86 intrinsic name.
# SIMDe exposes every intrinsic under a simde_ prefix; projects also define
# local wrapper macros.
simde_version: "0.8.4"
aliases:
  simde_mm_shuffle_epi8: _mm_shuffle_epi8
  simde_mm256_shuffle_epi8: _mm256_shuffle_epi8
  simde_mm_loadu_si32: _mm_loadu_si32
  simde_mm_cmpgt_epi64: _mm_cmpgt_epi64
  simde_mm_mullo_epi16: _mm_mullo_epi16
  simde_mm_mulhi_epi16: _mm_mulhi_epi16
  simde_mm_madd_epi16: _mm_madd_epi16
  simde_mm256_madd_epi16: _mm256_madd_epi16
  simde_mm_add_epi32: _mm_add_epi32
  simde_mm_cvtepi32_epi64: _mm_cvtepi32_epi64
