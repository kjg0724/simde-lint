# Per-intrinsic costs for the rules that match a set of registered intrinsics
# across two register widths, keyed by rule id and then by the specific
# intrinsic matched -- a finding must cite the cost of the intrinsic actually
# seen at the call site, not the rule's 128-bit case regardless of what fired.
# Rule W is the one exception: it matches a fixed three-call sequence rather
# than a registered intrinsic, so its entry stays flat, keyed by rule id
# alone (see the note under W below).
#
# `unknown` marks a cost, or a suggested fused/replacement instruction, that
# could not be established from the SIMDe source. It is the honest answer,
# not a placeholder to fill in later.
#
# Line numbers were read from the reference SIMDe checkout (0.8.4); counts
# move with the SIMDe version, which is why it is recorded here.
simde_version: "0.8.4"
patterns:
  S.pshufb_guard:
    _mm_shuffle_epi8:
      simde_insns: 3
      native_insns: 1
      suggestion: vqtbl1q_u8
      source: x86/ssse3.h:346
      note: >-
        vqtbl1q_s8(a, vandq_u8(b, vdupq_n_u8(0x8F))) -- the table lookup plus a
        dup of the guard constant and the and that applies it
    _mm256_shuffle_epi8:
      simde_insns: 6
      native_insns: 2
      suggestion: vqtbl1q_u8
      source: x86/avx2.h:4483
      note: >-
        r_.m128i[0] = simde_mm_shuffle_epi8(...); r_.m128i[1] = ... -- the
        128-bit expansion applied twice, once per 128-bit half
  W.mul16_widen_roundtrip:
    # This rule matches a three-call sequence, not one registered intrinsic,
    # and only in its 128-bit form, so one rule-level entry describes it
    # exactly; there is no second width to key by.
    simde_insns: 5
    native_insns: 1
    # No `suggestion`: which widening multiply replaces the round-trip depends
    # on which unpack consumes it -- `vmull_s16` rebuilds lanes 0-3 and
    # `vmull_high_s16` lanes 4-7 -- and only the rule knows which one it
    # matched. This field held `vmull_s16` unconditionally, which was the
    # wrong half whenever the consumer was `_mm_unpackhi_epi16`.
    #
    # `native_insns: 1` is right for both: the rule matches a single unpack,
    # so the four lanes that unpack reconstructs are what a finding covers,
    # and one widening multiply produces them. Only its name differs.
    source: x86/sse2.h:5188
    note: >-
      mulhi_epi16 alone expands to a widening multiply pair plus an unzip;
      the x86 source adds mullo_epi16 (x86/sse2.h:5278) and an unpack, all of
      which a single widening multiply replaces
  F.mul_add_no_fuse:
    _mm_mullo_epi16:
      simde_insns: 2
      native_insns: 1
      suggestion: vmlaq_s16
      accumulator_lanes: 16
      source: x86/sse2.h:5278
      transform_status: established
      note: >-
        expands to vmulq_s16 alone; mullo_epi16 does not widen, so a
        non-widening multiply-accumulate exists for i16 lanes
    _mm_mullo_epi32:
      simde_insns: 2
      native_insns: 1
      suggestion: vmlaq_s32
      accumulator_lanes: 32
      source: x86/sse4.1.h:2077
      transform_status: established
      note: >-
        expands to vmulq_s32 alone; mullo_epi32 does not widen, so a
        non-widening multiply-accumulate exists for i32 lanes
    _mm_mul_epi32:
      simde_insns: 4
      native_insns: 3
      suggestion: vmlal_s32
      accumulator_lanes: 64
      source: x86/sse4.1.h:2041
      transform_status: established
      note: >-
        expands to vmovn_s64, vmovn_s64, vmull_s32 -- smlal_s32 absorbs the
        add, but the two narrowings that feed the widening multiply remain
    _mm256_mul_epi32:
      simde_insns: 8
      native_insns: 6
      suggestion: vmlal_s32
      accumulator_lanes: 64
      source: x86/avx2.h:3921
      transform_status: established
      note: the 128-bit expansion applied twice
    _mm_madd_epi16:
      simde_insns: 4
      native_insns: unknown
      suggestion: vmlal_s16 / vmlal_high_s16
      accumulator_lanes: 32
      source: x86/sse2.h:4463
      transform_status: conditional
      note: >-
        expands to a pairwise widening multiply and a horizontal add;
        AArch64 has no pairwise 16->32 multiply-accumulate, so no
        unconditional fused form exists. vmlal_s16 (low four lanes) and
        vmlal_high_s16 (high four) absorb the accumulate when the consumer
        is a horizontal reduction, which this rule does not check -- hence
        conditional. SIMDe uses exactly this pair at x86/xop.h:2859-2860.
    _mm256_madd_epi16:
      simde_insns: 8
      native_insns: unknown
      suggestion: vmlal_s16 / vmlal_high_s16
      accumulator_lanes: 32
      source: x86/avx2.h:3146
      transform_status: conditional
      note: >-
        expands to a pairwise widening multiply and a horizontal add;
        AArch64 has no pairwise 16->32 multiply-accumulate, so no
        unconditional fused form exists. vmlal_s16 and vmlal_high_s16
        absorb the accumulate independently in each 128-bit half when the
        consumer is a horizontal reduction, which this rule does not
        check -- hence conditional. SIMDe uses exactly this pair at
        x86/xop.h:2859-2860.
    _mm_mul_ps:
      simde_insns: 2
      native_insns: 1
      suggestion: vfmaq_f32
      accumulator_lanes: 32
      source: x86/sse.h:3516
      transform_status: changes_result
      note: >-
        expands to vmulq_f32 alone, and _mm_add_ps to vaddq_f32 (sse.h:901);
        vfmaq_f32 fuses the pair but rounds once where the two round twice
    _mm256_mul_ps:
      simde_insns: 4
      native_insns: 2
      suggestion: vfmaq_f32
      accumulator_lanes: 32
      source: x86/avx.h:5092
      transform_status: changes_result
      note: the 128-bit expansion applied twice
    _mm256_mullo_epi16:
      simde_insns: unknown
      portable_fallback: true
      native_insns: unknown
      suggestion: vmlaq_s16
      accumulator_lanes: 16
      source: x86/avx2.h:4055
      transform_status: established
      note: >-
        no NEON branch -- falls through to the portable per-element loop over
        the 16 i16 lanes, as the epi32 sibling does, so no instruction count
        can be read from the SIMDe source; both counts are unknown
    _mm256_mullo_epi32:
      simde_insns: unknown
      portable_fallback: true
      native_insns: unknown
      suggestion: vmlaq_s32
      accumulator_lanes: 32
      source: x86/avx2.h:4076
      transform_status: established
      note: >-
        no NEON branch -- falls through to the portable per-element loop over
        the 8 i32 lanes. The loop carries SIMDE_VECTORIZE, so whether any
        vector instruction is emitted at all is the compiler's decision, and
        no instruction count can be read from the SIMDe source; both counts
        stay unknown. The fused replacement is established independently of
        that: mullo_epi32 does not widen, so the 128-bit vmlaq_s32 case
        applies twice over the 8 lanes
  M.scalar_insert_chain:
    _mm_insert_epi16:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/sse2.h:4005
      note: >-
        the NEON branch is a vsetq_lane_s16 macro. This entry recorded
        2 -> 1 vld1q_lane_s16 per chain element, read as a general-purpose
        register transfer the lane load avoids. Neither count holds: with the
        scalar coming from memory, Apple clang 21 and GCC 13.5 both compile
        the SIMDe chain and the lane-load chain to the same instructions at
        -O2 and -O3 -- byte-identical for a four-lane int32 chain -- and with
        the scalar already in a register a lane load does not apply. The cost
        turns on where the operand lives and on the optimizer, so it is not
        readable from this branch
    _mm_insert_epi32:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/sse4.1.h:1598
      note: the NEON branch is a vsetq_lane_s32 macro; same as insert_epi16
    _mm_insert_epi64:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/sse4.1.h:1639
      note: >-
        the NEON branch is a vsetq_lane_s64 macro. An earlier entry cited
        line 1619 and said there was no lane-insert branch; 1619 is inside
        the SIMDE_BUG_GCC_94482 fallback body, not the branch selected on
        NEON
    _mm256_insert_epi16:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/avx.h:4046
      note: no NEON branch
    _mm256_insert_epi32:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/avx.h:4065
      note: no NEON branch -- a scalar store into the private lane array
    _mm256_insert_epi64:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/avx.h:4086
      note: no NEON branch -- a scalar store into the private lane array
  M.scalar_set_build:
    _mm_set_epi64x:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/sse2.h:5811
      note: >-
        the NEON branch writes each argument into a local array and loads it
        with vld1q_s64. That is the source idiom and not the emitted code:
        the array is a candidate for scalar replacement, and in every case
        measured -- Apple clang 21 and GCC 13.5, -O2 and -O3 -- neither
        compiler kept it, clang folding each argument into a lane load and
        GCC loading into FP registers and moving into lanes. This entry
        recorded 1 -> 1 per assembled lane for a trip through memory that no
        measured case performs; the emitted cost varies with argument shape
        and compiler, so it is not readable here
    _mm_set_epi32:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/sse2.h:5728
      note: same source idiom as set_epi64x
    _mm_set_epi16:
      simde_insns: unknown
      native_insns: unknown
      suggestion: unknown
      source: x86/sse2.h:5676
      note: same source idiom as set_epi64x
  P.cmp_immediate_use:
    _mm_cmpgt_epi64:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/sse4.2.h:326
      note: >-
        vcgtq_s64 followed immediately by its consumer. No instruction is
        saved; the cost is the use-to-use latency, which is why the impact
        class is diagnostic
    _mm_cmpgt_epi32:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/sse2.h:2696
      note: vcgtq_s32, same shape as cmpgt_epi64
    _mm_cmpgt_epi16:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/sse2.h:2661
      note: vcgtq_s16, same shape as cmpgt_epi64
    _mm_cmpgt_epi8:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/sse2.h:2626
      note: vcgtq_s8, same shape as cmpgt_epi64
    _mm_cmpeq_epi32:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/sse2.h:2171
      note: vceqq_s32, same shape as cmpgt_epi64
    _mm_cmpeq_epi64:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/sse4.1.h:525
      note: vceqq_u64, same shape as cmpgt_epi64
    _mm256_cmpgt_epi32:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/avx2.h:1590
      note: the 128-bit expansion applied twice
    _mm256_cmpgt_epi64:
      simde_insns: 2
      native_insns: 2
      suggestion: reorder independent work between the compare and its use
      source: x86/avx2.h:1623
      note: the 128-bit expansion applied twice
